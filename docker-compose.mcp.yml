# Удалённый MCP. Отдельно от приложения в панели по одной причине: секретный токен
# хранится в файле .env рядом на сервере, а не в настройках панели.
#
# Запуск на сервере:
#   docker compose -f docker-compose.mcp.yml -p tropa-mcp up -d --build
services:
  mcp:
    build: .
    image: tropa:dokploy
    restart: unless-stopped
    command: ['node', 'mcp/http.js']
    environment:
      # Соседний контейнер с Tropa находится по имени сервиса в общей сети Dokploy.
      TROPA_API_URL: http://tropa:4317/api
      TROPA_MCP_HOST: 0.0.0.0
      TROPA_MCP_PORT: '4318'
      TROPA_MCP_TOKEN: ${TROPA_MCP_TOKEN:?нужен TROPA_MCP_TOKEN - секретный токен MCP}
    networks:
      - dokploy-network
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4318/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 5s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      - traefik.http.routers.tropa-mcp-web.rule=Host(`mcp.tropamap.ru`)
      - traefik.http.routers.tropa-mcp-web.entrypoints=web
      - traefik.http.routers.tropa-mcp-web.middlewares=redirect-to-https@file

      # Пароль здесь не нужен: вход закрыт секретным токеном в заголовке.
      - traefik.http.routers.tropa-mcp.rule=Host(`mcp.tropamap.ru`)
      - traefik.http.routers.tropa-mcp.entrypoints=websecure
      - traefik.http.routers.tropa-mcp.tls=true
      - traefik.http.routers.tropa-mcp.tls.certresolver=letsencrypt
      - traefik.http.services.tropa-mcp.loadbalancer.server.port=4318

networks:
  dokploy-network:
    external: true
