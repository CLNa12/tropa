# Приложение для Dokploy: сама Tropa. Порт наружу не публикуется — всех пускает Traefik.
# Том с картами уже существует на сервере, новый не создаётся.
# Удалённый MCP живёт отдельно, в docker-compose.mcp.yml, чтобы секретный токен
# не пришлось хранить в панели.
services:
  tropa:
    build: .
    image: tropa:dokploy
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: '4317'
      TROPA_HOME: /data
    volumes:
      - tropa-data:/data
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # http → https
      - traefik.http.routers.tropa-web.rule=Host(`tropamap.ru`) || Host(`www.tropamap.ru`)
      - traefik.http.routers.tropa-web.entrypoints=web
      - traefik.http.routers.tropa-web.middlewares=redirect-to-https@file

      # Канвас, открывшись, сам сохраняет раскладку — запрос уходит без участия
      # человека. Гостю на него отвечаем «запрещено», а не «нужен пароль»: иначе
      # браузер показывает окно входа просто при открытии карты.
      # Условие «нет заголовка Authorization» — то есть посетитель ещё не вошёл;
      # у вошедшего запрос идёт дальше, по обычному правилу с паролем, и сохраняется.
      - traefik.http.routers.tropa-layout-guest.rule=(Host(`tropamap.ru`) || Host(`www.tropamap.ru`)) && Method(`POST`) && PathRegexp(`^/api/roadmaps/[^/]+/positions$`) && !HeaderRegexp(`Authorization`, `.+`)
      - traefik.http.routers.tropa-layout-guest.entrypoints=websecure
      - traefik.http.routers.tropa-layout-guest.tls=true
      - traefik.http.routers.tropa-layout-guest.tls.certresolver=letsencrypt
      - traefik.http.routers.tropa-layout-guest.priority=200
      - traefik.http.routers.tropa-layout-guest.middlewares=deny-403@file
      - traefik.http.routers.tropa-layout-guest.service=tropa

      # Чтение — всем, без пароля: GET, HEAD и OPTIONS.
      # Приоритет выше, поэтому такие запросы разбираются этим маршрутом.
      - traefik.http.routers.tropa-read.rule=(Host(`tropamap.ru`) || Host(`www.tropamap.ru`)) && (Method(`GET`) || Method(`HEAD`) || Method(`OPTIONS`))
      - traefik.http.routers.tropa-read.entrypoints=websecure
      - traefik.http.routers.tropa-read.tls=true
      - traefik.http.routers.tropa-read.tls.certresolver=letsencrypt
      - traefik.http.routers.tropa-read.priority=100
      - traefik.http.routers.tropa-read.service=tropa

      # Всё остальное — правки и удаления — только по логину и паролю.
      - traefik.http.routers.tropa.rule=Host(`tropamap.ru`) || Host(`www.tropamap.ru`)
      - traefik.http.routers.tropa.entrypoints=websecure
      - traefik.http.routers.tropa.tls=true
      - traefik.http.routers.tropa.tls.certresolver=letsencrypt
      - traefik.http.routers.tropa.priority=50
      - traefik.http.routers.tropa.middlewares=tropa-auth@file
      - traefik.http.routers.tropa.service=tropa
      - traefik.http.services.tropa.loadbalancer.server.port=4317

volumes:
  tropa-data:
    external: true
    name: tropa_tropa-data

networks:
  dokploy-network:
    external: true
